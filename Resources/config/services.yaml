services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  thefehr.timesheet.rounding.default:
    class: KimaiPlugin\TheFehrDurationBundle\Timesheet\Rounding\OverriddenDurationRounding
    decorates: App\Timesheet\Rounding\DefaultRounding
    arguments:
      - '@thefehr.timesheet.rounding.default.inner'

  thefehr.timesheet.rounding.ceil:
    class: KimaiPlugin\TheFehrDurationBundle\Timesheet\Rounding\OverriddenDurationRounding
    decorates: App\Timesheet\Rounding\CeilRounding
    arguments:
      - '@thefehr.timesheet.rounding.ceil.inner'

  thefehr.timesheet.rounding.closest:
    class: KimaiPlugin\TheFehrDurationBundle\Timesheet\Rounding\OverriddenDurationRounding
    decorates: App\Timesheet\Rounding\ClosestRounding
    arguments:
      - '@thefehr.timesheet.rounding.closest.inner'

  thefehr.timesheet.rounding.floor:
    class: KimaiPlugin\TheFehrDurationBundle\Timesheet\Rounding\OverriddenDurationRounding
    decorates: App\Timesheet\Rounding\FloorRounding
    arguments:
      - '@thefehr.timesheet.rounding.floor.inner'

  KimaiPlugin\TheFehrDurationBundle\:
    resource: '../../*'
    exclude: '../../{Resources,Migrations,Timesheet}'
